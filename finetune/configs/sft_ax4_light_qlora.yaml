# 최종 후보 1 (W14). A.X 4.0 Light 7B, Qwen2.5 기반, hermes 툴콜 포맷 (ADR 0009)
model: skt/A.X-4.0-Light
quant:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  seq_len: 1024        # 8GB 한계. vram_probe 로 확인 후 조정
  per_device_batch: 1
  grad_accum: 16
  epochs: 2
  lr: 1.5e-4
  warmup_ratio: 0.03
  scheduler: cosine
  gradient_checkpointing: true
  assistant_only_loss: true
data:
  train: data/processed/sft/train.jsonl
  eval: data/processed/sft/eval.jsonl
  exclude_tags_from: evals/benchmark/questions.jsonl
tracking:
  mlflow_experiment: sabior-sft
