# SFT 1차 설정 초안 (W13). vram_probe 결과로 seq_len, batch 를 조정한다.
model: Qwen/Qwen3-4B
quant:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  seq_len: 2048
  per_device_batch: 2
  grad_accum: 8
  epochs: 2
  lr: 2.0e-4
  warmup_ratio: 0.03
  scheduler: cosine
  gradient_checkpointing: true
  assistant_only_loss: true
data:
  train: data/processed/sft/train.jsonl
  eval: data/processed/sft/eval.jsonl
  exclude_tags_from: evals/benchmark/questions.jsonl
tracking:
  mlflow_experiment: sabior-sft
