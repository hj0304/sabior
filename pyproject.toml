[project]
name = "sabior"
version = "0.1.0"
description = "KBO 세이버메트리션 LLM: 도구 호출 기반 야구 분석 에이전트와 파인튜닝 프로젝트"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.8",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "rich>=13",
]

# 의존성 그룹. 기본 sync는 dev만 설치한다. 나머지는 필요할 때 --group 으로 추가.
#   uv sync --group models      예측 모델 (P2)
#   uv sync --group agent       에이전트·RAG (P3)
#   uv sync --group finetune    파인튜닝 (P4). WSL2 권장. Windows 네이티브에서 CUDA torch가 필요하면
#                               아래 [tool.uv.sources] 주석을 해제하고 cu124 인덱스를 사용한다.
#   uv sync --group serve       FastAPI + Gradio (P5)
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel>=6"]
models = ["scikit-learn>=1.5", "lightgbm>=4.5", "statsmodels>=0.14", "scipy>=1.13"]
agent = ["ollama>=0.3", "anthropic>=0.40", "chromadb>=0.5", "sentence-transformers>=3"]
finetune = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44",
    "datasets>=3",
    "accelerate>=1",
    "mlflow>=2.16",
]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "gradio>=4.44"]

[tool.uv]
default-groups = ["dev"]

# [[tool.uv.index]]
# name = "pytorch-cu124"
# url = "https://download.pytorch.org/whl/cu124"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu124", marker = "sys_platform == 'win32'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db", "etl", "stats", "models", "backtest", "agent", "evals", "finetune", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 줄 길이는 ruff format 이 맡는다
